name: Keep OmniRoute fork synced with upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - release/v3.8.52
    paths:
      - .github/workflows/sync-upstream.yml

permissions:
  contents: write

concurrency:
  group: omniroute-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mirror upstream release/v3.8.53 into this fork
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const upstreamOwner = "cheaper-inference";
            const upstreamRepo = "OmniRoute";
            const upstreamBranch = "release/v3.8.53";
            const mirrorBranch = "release/v3.8.53";

            const source = await github.rest.repos.getBranch({
              owner: upstreamOwner,
              repo: upstreamRepo,
              branch: upstreamBranch
            });
            const sourceSha = source.data.commit.sha;

            let targetSha = null;
            try {
              const target = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${mirrorBranch}`
              });
              targetSha = target.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (targetSha === sourceSha) {
              core.info(`Mirror already current at ${sourceSha}.`);
              return;
            }

            if (targetSha) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `heads/${mirrorBranch}`,
                sha: sourceSha,
                force: true
              });
              core.info(`Updated dedicated mirror branch ${mirrorBranch}: ${targetSha} -> ${sourceSha}.`);
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${mirrorBranch}`,
                sha: sourceSha
              });
              core.info(`Created mirror branch ${mirrorBranch} at ${sourceSha}.`);
            }
